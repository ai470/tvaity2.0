<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ТВАЙТИ — Новый способ управления деньгами</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">
  <div class="hero__glow" aria-hidden="true"></div>

  <div class="hero__inner">
    <div class="hero__logo">
      <svg class="hero__logo-mark" viewBox="0 0 71 69" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M43.6143 68.2649H27.496V32.2362C27.496 23.3344 34.7124 16.1181 43.6143 16.1181V68.2649Z" fill="currentColor"/>
        <path d="M70.6362 0V16.1181L40.2958 16.1181C31.3939 16.1181 24.1775 8.90178 24.1775 0L70.6362 0Z" fill="currentColor"/>
        <path d="M0 0L0 16.1181H8.05916C16.9611 16.1181 24.1775 8.90178 24.1775 0L0 0Z" fill="currentColor"/>
      </svg>ВАЙТИ
    </div>

    <p class="hero__date">22&ndash;24 сентября в 18:00 по МСК</p>
    <p class="hero__lead">Масштабная презентация приложения ТВАЙТИ 2.0</p>

    <h1 class="hero__title">
      Новый способ<br>
      управления деньгами
    </h1>
    <p class="hero__subtitle">который доступен каждому</p>

    <a href="#register" class="hero__cta">
      Зарегистрироваться
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3.33334 8H12.6667" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M9.33334 4.66675L12.6667 8.00008L9.33334 11.3334" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <div class="countdown" data-countdown data-target="2026-09-22T18:00:00+03:00">
      <div class="countdown__item">
        <span class="countdown__value" data-unit="days">00</span>
        <span class="countdown__label">дня</span>
      </div>
      <span class="countdown__divider"></span>
      <div class="countdown__item">
        <span class="countdown__value" data-unit="hours">00</span>
        <span class="countdown__label">часов</span>
      </div>
      <span class="countdown__divider"></span>
      <div class="countdown__item">
        <span class="countdown__value" data-unit="minutes">00</span>
        <span class="countdown__label">минут</span>
      </div>
      <span class="countdown__divider"></span>
      <div class="countdown__item">
        <span class="countdown__value" data-unit="seconds">00</span>
        <span class="countdown__label">секунд</span>
      </div>
    </div>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
