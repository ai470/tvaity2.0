# Only this virtual host is managed by deploy/deploy.sh.
# The legacy Next.js export (including /reg and /reg-01) is a separate site.
server {
    listen 80;
    server_name 2.tvaity.ru;
    return 301 https://2.tvaity.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name 2.tvaity.ru;

    ssl_certificate /etc/letsencrypt/live/2.tvaity.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/2.tvaity.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/2.tvaity.ru;
    index index.html;
    access_log /var/log/nginx/tvaity2.access.log;
    error_log /var/log/nginx/tvaity2.error.log;

    # Explicit boundaries: /reg must never catch /reg-short or /reg-01.
    location = /reg { return 301 /reg/$is_args$args; }
    location = /reg-01 { return 301 /reg-01/$is_args$args; }
    location ^~ /reg/ {
        root /var/www/tvaity2.0-deploy/current/legacy;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /reg-01/ {
        root /var/www/tvaity2.0-deploy/current/legacy;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Patched bundle has a new content hash; all other Next assets stay original.
    location ^~ /_next/ {
        root /var/www/tvaity2.0-deploy/current/legacy;
        try_files $uri @legacy_next;
    }
    location @legacy_next {
        root /var/www/2.tvaity.ru;
        try_files $uri =404;
    }

    location = /reg-short { return 301 /reg-short/$is_args$args; }
    location ^~ /reg-short/ {
        root /var/www/tvaity2.0-deploy/current;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location = /sps { return 301 /sps/$is_args$args; }
    location ^~ /sps/ {
        root /var/www/tvaity2.0-deploy/current;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Keep the legacy site's root, _next assets and other routes intact.
    location / { try_files $uri $uri/ =404; }
}
